<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Book List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"/>
</head>
<body class="container mx-auto p-4">
<h1 class="text-2xl font-bold mb-4">Book List</h1>
<a th:href="@{/books/new}" class="bg-blue-500 text-white px-4 py-2 rounded mb-4 inline-block">Add New Book</a>
<ul class="list-disc">
    <li th:each="book : ${books}" class="mb-2">
        <a th:href="@{/books/{id}(id=${book.id})}" th:text="${book.title}"></a>
        (<span th:text="${book.category}"></span>)
    </li>
</ul>
</body>
</html>
