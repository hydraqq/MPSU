<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add/Edit Book</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"/>
</head>
<body class="container mx-auto p-4">
<h1 class="text-2xl font-bold mb-4" th:text="${bookId} ? 'Edit Book' : 'Add New Book'"></h1>
<div th:if="${error}" class="text-red-500 mb-4" th:text="${error}"></div>
<form th:action="${bookId} ? @{/books/update/{id}(id=${bookId})} : @{/books}" th:object="${bookForm}" method="post">
    <input type="hidden" name="_method" value="PUT" th:if="${bookId}"/>
    <div class="mb-4">
        <label class="block text-sm font-bold mb-2">Title:</label>
        <input type="text" th:field="*{title}" class="border p-2 w-full" required/>
    </div>
    <div class="mb-4">
        <label class="block text-sm font-bold mb-2">Category:</label>
        <select th:field="*{category}" class="border p-2 w-full" th:disabled="${bookId} ? 'true' : 'false'" required>
            <option value="" disabled selected>Select a category</option>
            <option value="Fiction">Fiction</option>
            <option value="Horror">Horror</option>
            <option value="Fantasy">Fantasy</option>
        </select>
    </div>
    <div class="mb-4">
        <label class="block text-sm font-bold mb-2">Description:</label>
        <textarea th:field="*{description}" class="border p-2 w-full" required></textarea>
    </div>
    <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded">Save</button>
    <a th:href="@{/books}" class="bg-gray-500 text-white px-4 py-2 rounded">Cancel</a>
</form>
</body>
</html>
