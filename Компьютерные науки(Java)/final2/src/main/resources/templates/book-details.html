<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Book Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"/>
</head>
<body class="container mx-auto p-4">
<h1 class="text-2xl font-bold mb-4">Book Details</h1>
<p><strong>Title:</strong> <span th:text="${book.title}"></span></p>
<p><strong>Category:</strong> <span th:text="${book.category}"></span></p>
<p><strong>Description:</strong> <span th:text="${book.description}"></span></p>
<a th:href="@{/books/edit/{id}(id=${book.id})}" class="bg-yellow-500 text-white px-4 py-2 rounded mr-2">Edit</a>
<form th:action="@{/books/delete/{id}(id=${book.id})}" method="post" class="inline">
    <button type="submit" class="bg-red-500 text-white px-4 py-2 rounded">Delete</button>
</form>
<a th:href="@{/books}" class="bg-gray-500 text-white px-4 py-2 rounded mt-4 inline-block">Back to List</a>
</body>
</html>
