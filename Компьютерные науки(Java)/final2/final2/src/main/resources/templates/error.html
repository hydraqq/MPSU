<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Error</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"/>
</head>
<body class="container mx-auto p-4">
<h1 class="text-2xl font-bold mb-4">An Error Occurred</h1>
<p><strong>Status:</strong> <span th:text="${status}"></span></p>
<p><strong>Message:</strong> <span th:text="${message}"></span></p>
<p><strong>Exception:</strong> <span th:text="${exception}"></span></p>
<a th:href="@{/books}" class="bg-blue-500 text-white px-4 py-2 rounded mt-4 inline-block">Back to Book List</a>
</body>
</html>
